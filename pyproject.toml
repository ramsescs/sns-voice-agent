[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triage"
version = "0.1.0"
description = "Deterministic SET triage core for the SNS voice-agent thesis MVP"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "pydantic>=2",
    "pyyaml",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
