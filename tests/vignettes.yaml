# Findings -> expected SET level, seeding the thesis's stratified
# under-triage benchmark (not throwaway — see issues/003).
#
# Each vignette gives ClinicalFindings input and the level / care channel /
# uncertainty the set_engine must produce for it.

- id: chest_pain_severe_pain
  findings:
    presenting_complaint: chest_pain
    pain_score: 9
  expected_level: 2
  expected_care_channel: "emergency/112"
  expected_uncertainty: false

- id: chest_pain_radiating
  findings:
    presenting_complaint: chest_pain
    pain_score: 3
    chest_pain_radiating: true
  expected_level: 2
  expected_care_channel: "emergency/112"
  expected_uncertainty: false

- id: chest_pain_moderate_pain
  findings:
    presenting_complaint: chest_pain
    pain_score: 6
  expected_level: 3
  expected_care_channel: "urgent care"
  expected_uncertainty: false

- id: chest_pain_mild_pain
  findings:
    presenting_complaint: chest_pain
    pain_score: 2
  expected_level: 4
  expected_care_channel: "primary-care appointment"
  expected_uncertainty: false

- id: chest_pain_zero_pain
  findings:
    presenting_complaint: chest_pain
    pain_score: 0
  expected_level: 4
  expected_care_channel: "primary-care appointment"
  expected_uncertainty: false

- id: chest_pain_missing_data
  findings:
    presenting_complaint: chest_pain
  expected_level: 3
  expected_care_channel: "urgent care"
  expected_uncertainty: true

